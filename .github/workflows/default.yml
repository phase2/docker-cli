---
name: "build images"

on:
  push:
    branches:
      - master
  workflow_dispatch:
  pull_request:
  schedule:
  - cron: '0 16 * * 0' # Every Sunday at 4PM

env:
  DOCKERHUB_ORG: ${{ secrets.DOCKERHUB_ORG }}
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build:
    name: "Build: ${{ matrix.version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false # Don't cancel other jobs if one fails
      matrix:
        include:
          - version: "8.2"
          - version: "8.3"
          - version: "8.4"
    env:
      VERSION: ${{ matrix.version }}

    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare Tags
        id: prep
        run: |
          DOCKERHUB_IMAGE=${DOCKERHUB_ORG}/${GITHUB_REPOSITORY#*/}
          GITHUB_IMAGE=${{ github.repository_owner }}/${GITHUB_REPOSITORY#*/}
          VERSION=php${{ matrix.version }}

          TAGS="ghcr.io/${GITHUB_IMAGE}:${VERSION}"
          # Only push to Dockerhub if secrets are set.
          if [ ! -z "${DOCKERHUB_ORG}" ]; then
            TAGS="$TAGS,${DOCKERHUB_IMAGE}:${VERSION}"
          fi

          # Set output parameters.
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_ORG != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./src
          file: ./src/Dockerfile
          build-args: |
            CLI_IMAGE=ghcr.io/${{ github.repository_owner }}/service-cli
            CLI_VERSION=php${{ matrix.version }}
            INSTALL_SQLITE=${{ matrix.version >= '8.3' }}
          platforms: linux/amd64,linux/arm64
          push:  ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.prep.outputs.tags }}
          pull: true
          no-cache: true
